# [CATALOG] Satu sumber versi dependensi eksternal. Dibaca juga oleh scripts/bundle_gate.py dan scripts/offline_gate.py.
# NewPipeExtractor sengaja TIDAK di sini: dipin di engine/newpipe/build.gradle.kts lewat scripts/newpipe/bump_pin.py + pins.sha256.
# Versi plugin (AGP, Kotlin) tetap di build.gradle.kts akar.
[versions]
compose-bom = "2024.12.01"
activity-compose = "1.9.3"
coroutines = "1.9.0"
commons-compress = "1.27.1"
zip4j = "2.11.5"
tukaani-xz = "1.10"
sora = "0.23.6"
appcompat = "1.7.0"
recyclerview = "1.3.2"
media = "1.7.0"
preference = "1.2.1"
material = "1.12.0"
datastore = "1.1.1"
work = "2.9.1"
annotation = "1.9.1"
desugar = "2.1.5"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "tukaani-xz" }
sora-core = { module = "io.github.Rosemoe.sora-editor:editor", version.ref = "sora" }
sora-textmate = { module = "io.github.Rosemoe.sora-editor:language-textmate", version.ref = "sora" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
android-desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
