name: Vault bunker
on:
  push:
    branches: [main]
    paths: ["vault/**", "scripts/**", "settings.gradle.kts", "build.gradle.kts", ".github/workflows/vault.yml"]
  workflow_dispatch:
concurrency:
  group: vault-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/telemetry_gate.py
      - run: python3 scripts/secret_gate.py
      - run: python3 scripts/bundle_gate.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Build Vault release (R8)
        run: gradle :vault:assembleRelease --stacktrace
      - name: Verifikasi bunker
        run: |
          shopt -s nullglob
          apks=(vault/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo "::error::APK Vault tidak ditemukan"; exit 1; }
          for f in "${apks[@]}"; do bash scripts/verify-bunker.sh "$f"; done
